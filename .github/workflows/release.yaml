name: HondApp - OTA automatico

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo desta versao
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compilar firmware ESP32-S3
        run: pio run -e esp32-s3-devkitc-1

      - name: Preparar binario OTA
        run: cp .pio/build/esp32-s3-devkitc-1/firmware.bin main.cpp.bin

      - name: Criar Release e publicar OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.run_number }}
          name: HondApp OTA ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: main.cpp.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
